<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LABUAN4D — Live Score & Jadwal Pertandingan Realtime</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        oceanDark: '#020c1b',
                        oceanCard: '#08223c',
                        oceanBorder: '#123e6b',
                        oceanAccent: '#00d2ff',
                        oceanGlow: '#0088ff'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(180deg, #010a16 0%, #061c33 50%, #010a16 100%);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card {
            background: rgba(8, 34, 60, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 210, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 10, 30, 0.4);
        }
        .ocean-gradient-text {
            background: linear-gradient(135deg, #a0ecff 0%, #00d2ff 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glow-btn-green {
            background: linear-gradient(90deg, #10b981 0%, #059669 100%);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }
        .glow-btn-green:hover {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.7);
        }
        .team-logo-sm {
            width: 20px;
            height: 20px;
            object-fit: contain;
            display: inline-block;
        }
        .league-badge {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 9999px;
            text-transform: uppercase;
        }
        .league-header {
            background: rgba(0, 210, 255, 0.08);
            border-left: 4px solid #00d2ff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- CONFIGURATION -->
    <script>
        const CONFIG = {
            LINK_LOGIN: "https://rotasy.link/Labuan4D",
            LINK_DAFTAR: "https://shortq.org/labuan4Dwin1",
            AUTO_SLIDE_INTERVAL: 4000,
            AUTO_REFRESH_SECONDS: 15 // Tarik data baru dari API tiap 15 detik
        };

        function goToLogin() { window.open(CONFIG.LINK_LOGIN, '_blank'); }
        function goToDaftar() { window.open(CONFIG.LINK_DAFTAR, '_blank'); }

        function handleImgError(img) {
            img.onerror = null;
            img.src = "https://cdn-icons-png.flaticon.com/512/53/53283.png";
        }
    </script>

    <!-- HEADER / NAVBAR -->
    <header class="sticky top-0 z-50 glass-card border-b border-cyan-900/60 bg-slate-950/90">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 py-2.5 flex items-center justify-between">
            <a href="javascript:void(0)" onclick="goToDaftar()" class="flex items-center gap-2 group">
                <div class="flex items-center px-1 py-0.5 rounded-xl border border-cyan-500/40 bg-gradient-to-r from-cyan-950 to-slate-900">
                    <img src="logo.jpeg" alt="LABUAN4D Logo" class="h-9 sm:h-11 w-auto object-contain drop-shadow" onerror="handleImgError(this)">
                </div>
            </a>

            <div class="flex items-center gap-1.5 sm:gap-3">
                <a href="javascript:void(0)" onclick="goToDaftar()" 
                   class="hidden md:inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full text-xs font-bold bg-cyan-950/80 border border-cyan-500/40 text-cyan-300 hover:bg-cyan-900 transition">
                   <i class="fa-solid fa-house text-cyan-400"></i> Beranda
                </a>
                
                <div class="flex items-center gap-1 sm:gap-1.5 px-2 sm:px-2.5 py-1.5 rounded-lg bg-black/60 border border-cyan-800 text-[11px] sm:text-xs font-mono text-cyan-300">
                    <span id="live-clock">00:00:00</span>
                    <span class="text-[9px] sm:text-[10px] text-emerald-400 font-bold">(WIB)</span>
                </div>

                <a href="javascript:void(0)" onclick="goToLogin()" 
                   class="px-2.5 sm:px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white border border-slate-600 hover:bg-slate-700 transition">
                   Login
                </a>

                <a href="javascript:void(0)" onclick="goToDaftar()" 
                   class="px-3 sm:px-5 py-1.5 rounded-lg text-xs font-bold text-white glow-btn-green transition transform hover:scale-105">
                   Daftar
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6 flex-grow w-full space-y-6">

        <!-- BANNER SLIDER -->
        <section class="relative max-w-5xl mx-auto rounded-2xl overflow-hidden glass-card border border-cyan-500/30 group">
            <div id="carousel-track" class="flex transition-transform duration-700 ease-in-out">
                <div class="min-w-full cursor-pointer bg-slate-950 flex items-center justify-center" onclick="goToDaftar()">
                    <img src="banner(3).jpg" alt="Partner Resmi Liga Inggris" class="w-full h-auto max-h-[220px] sm:max-h-[360px] md:max-h-[460px] object-contain mx-auto" onerror="handleImgError(this)">
                </div>
                <div class="min-w-full cursor-pointer bg-slate-950 flex items-center justify-center" onclick="goToDaftar()">
                    <img src="banner(1).jpg" alt="Bonus Special Terbaru Labuan4D" class="w-full h-auto max-h-[220px] sm:max-h-[360px] md:max-h-[460px] object-contain mx-auto" onerror="handleImgError(this)">
                </div>
                <div class="min-w-full cursor-pointer bg-slate-950 flex items-center justify-center" onclick="goToDaftar()">
                    <img src="banner(2).jpg" alt="Welcome to Labuan4D" class="w-full h-auto max-h-[220px] sm:max-h-[360px] md:max-h-[460px] object-contain mx-auto" onerror="handleImgError(this)">
                </div>
                <div class="min-w-full cursor-pointer bg-slate-950 flex items-center justify-center" onclick="goToDaftar()">
                    <img src="banner.jpg" alt="Deposit Kilat QRIS Labuan4D" class="w-full h-auto max-h-[220px] sm:max-h-[360px] md:max-h-[460px] object-contain mx-auto" onerror="handleImgError(this)">
                </div>
            </div>

            <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-2 z-10 bg-black/40 px-3 py-1 rounded-full backdrop-blur-sm" id="carousel-dots">
                <button class="w-5 h-2 rounded-full bg-cyan-400 transition-all" onclick="setSlide(0)"></button>
                <button class="w-2 h-2 rounded-full bg-white/40 transition-all" onclick="setSlide(1)"></button>
                <button class="w-2 h-2 rounded-full bg-white/40 transition-all" onclick="setSlide(2)"></button>
                <button class="w-2 h-2 rounded-full bg-white/40 transition-all" onclick="setSlide(3)"></button>
            </div>
        </section>

        <!-- HORIZONTAL SLIDER REALTIME -->
        <section class="space-y-2">
            <div class="flex items-center justify-between px-1">
                <h3 class="text-xs sm:text-sm font-extrabold text-cyan-300 uppercase tracking-wider flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span> Live Matches
                </h3>
                <span id="sync-status" class="text-[10px] text-cyan-400/80"><i class="fa-solid fa-rotate spin mr-1"></i> Syncing...</span>
            </div>
            <div class="relative overflow-hidden rounded-2xl p-1.5 bg-slate-950/70 border border-cyan-800/60">
                <div id="horizontal-match-slider" class="flex gap-3 transition-transform duration-500 ease-in-out no-scrollbar overflow-x-auto" style="scroll-behavior: smooth;">
                    <!-- Akan terisi data realtime -->
                </div>
            </div>
        </section>

        <!-- MAIN MATCH LIST SECTION WITH SEARCH -->
        <section class="glass-card rounded-2xl p-3 sm:p-5 border-cyan-800 space-y-6">
            <div class="border-b border-cyan-900/80 pb-3 flex flex-wrap justify-between items-center gap-3">
                <div>
                    <span class="text-[10px] sm:text-xs text-cyan-400 font-bold uppercase tracking-wider">Papan Skor & Jadwal Pertandingan Hari Ini</span>
                    <h2 class="text-base sm:text-lg md:text-2xl font-extrabold text-white">Live Match, Schedule & Predictions</h2>
                </div>

                <!-- MENU PENCARIAN -->
                <div class="relative w-full sm:w-72">
                    <input type="text" id="search-input" onkeyup="filterMatches()" placeholder="Cari tim atau liga..." 
                           class="w-full bg-slate-900/90 border border-cyan-700/60 rounded-xl px-3 py-2 pl-9 text-xs text-cyan-200 placeholder-cyan-500/60 focus:outline-none focus:border-cyan-400 transition">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-xs text-cyan-400"></i>
                </div>
            </div>

            <div id="match-list" class="space-y-6">
                <div class="text-center py-10 text-cyan-400/70 text-xs font-mono">
                    <i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i><br>
                    Memuat data pertandingan realtime...
                </div>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="mt-8 border-t border-cyan-900/60 bg-slate-950 py-4 text-center text-xs text-cyan-200/50">
        <div class="max-w-7xl mx-auto px-4 space-y-1">
            <p>© 2026 <strong class="text-cyan-400">LABUAN4D</strong>. Hak Cipta Dilindungi Undang-Undang.</p>
        </div>
    </footer>

    <!-- REALTIME API FETCHING SCRIPT -->
    <script>
        let allMatchesGrouped = {}; // Variabel global simpan data liga & pertandingan
        let autoScrollInterval = null; // Interval auto scroll horizontal

        // Realtime Clock WIB
        function updateClockWIB() {
            const options = { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const wibTimeString = new Intl.DateTimeFormat('id-ID', options).format(new Date());
            document.getElementById('live-clock').textContent = wibTimeString.replace(/\./g, ':');
        }
        setInterval(updateClockWIB, 1000);
        updateClockWIB();

        // Banner Slider Logic
        let currentSlide = 0;
        function setSlide(index) {
            currentSlide = index;
            document.getElementById('carousel-track').style.transform = `translateX(-${currentSlide * 100}%)`;
        }
        setInterval(() => {
            currentSlide = (currentSlide + 1) % 4;
            setSlide(currentSlide);
        }, CONFIG.AUTO_SLIDE_INTERVAL);

        // Auto Scroll Horizontal Slider Match
        function startHorizontalAutoScroll() {
            const slider = document.getElementById('horizontal-match-slider');
            if (!slider) return;

            if (autoScrollInterval) clearInterval(autoScrollInterval);

            autoScrollInterval = setInterval(() => {
                if (slider.scrollLeft + slider.clientWidth >= slider.scrollWidth - 5) {
                    slider.scrollTo({ left: 0, behavior: 'smooth' });
                } else {
                    slider.scrollBy({ left: 260, behavior: 'smooth' });
                }
            }, 3000); // Bergerak setiap 3 detik
        }

        // Helper untuk Menghasilkan Prediksi & HDP Konsisten Berdasarkan ID / Nama Pertandingan
        function generateMatchData(idStr) {
            let hash = 0;
            for (let i = 0; i < idStr.length; i++) {
                hash = idStr.charCodeAt(i) + ((hash << 5) - hash);
            }
            hash = Math.abs(hash);

            const hdps = ["0 : 0", "0 : 1/4", "0 : 1/2", "0 : 3/4", "0 : 1", "1/4 : 0", "1/2 : 0", "3/4 : 0"];
            const hdpVal = hdps[hash % hdps.length];

            const predHome = (hash % 3);
            const predAway = ((hash >> 2) % 3);
            const prediction = `${predHome} - ${predAway}`;

            return { hdp: hdpVal, prediction: prediction };
        }

        // API LIVE DATA FETCHING ENGINE
        async function fetchRealtimeMatches() {
            const syncElement = document.getElementById('sync-status');
            if(syncElement) syncElement.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-cyan-400 mr-1"></i> Syncing API...`;

            try {
                const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard');
                const data = await response.json();

                if (data && data.events) {
                    processAndRenderData(data.events);
                    if(syncElement) syncElement.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> Live Connected`;
                } else {
                    throw new Error("Format API tidak valid");
                }
            } catch (error) {
                console.warn("Gagal tarik API utama, menggunakan fallback server:", error);
                if(syncElement) syncElement.innerHTML = `<i class="fa-solid fa-wifi text-amber-400 mr-1"></i> Standby`;
            }
        }

        function processAndRenderData(events) {
            const sliderContainer = document.getElementById('horizontal-match-slider');
            sliderContainer.innerHTML = '';

            allMatchesGrouped = {}; // Reset data liga global

            events.forEach(event => {
                const competition = event.competitions[0];
                const leagueName = event.season?.slug ? event.season.slug.toUpperCase() : "LIGA UTAMA";
                
                const homeTeam = competition.competitors.find(c => c.homeAway === 'home');
                const awayTeam = competition.competitors.find(c => c.homeAway === 'away');

                const statusState = event.status.type.state;
                if (statusState === 'post') return; // Lewati jika selesai (FT)

                const isLive = statusState === 'in';
                const minuteDisplay = event.status.displayClock || "LIVE";
                
                const eventDate = new Date(event.date);
                const timeWIB = eventDate.toLocaleTimeString('id-ID', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hour12: false }) + " WIB";

                const matchData = generateMatchData(event.id || (homeTeam.team.name + awayTeam.team.name));

                const matchObj = {
                    league: leagueName,
                    teamHome: homeTeam.team.shortDisplayName || homeTeam.team.name,
                    teamAway: awayTeam.team.shortDisplayName || awayTeam.team.name,
                    logoHome: homeTeam.team.logo || "https://cdn-icons-png.flaticon.com/512/53/53283.png",
                    logoAway: awayTeam.team.logo || "https://cdn-icons-png.flaticon.com/512/53/53283.png",
                    scoreHome: isLive ? homeTeam.score : "-",
                    scoreAway: isLive ? awayTeam.score : "-",
                    time: timeWIB,
                    isLive: isLive,
                    minute: minuteDisplay,
                    hdp: matchData.hdp,
                    prediction: matchData.prediction
                };

                // Render Horizontal Card
                const sliderCard = `
                    <div onclick="goToDaftar()" class="min-w-[250px] glass-card p-3 rounded-xl border ${matchObj.isLive ? 'border-amber-500/60' : 'border-slate-800'} cursor-pointer flex-shrink-0 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center text-[10px] mb-1.5">
                                <span class="league-badge bg-blue-900/80 text-cyan-300 truncate max-w-[120px]">${matchObj.league}</span>
                                ${matchObj.isLive ? `<span class="px-2 py-0.5 rounded bg-emerald-500 text-slate-950 font-black">${matchObj.minute}</span>` : `<span class="text-cyan-400 font-mono">${matchObj.time}</span>`}
                            </div>
                            <div class="space-y-1 text-xs font-bold text-white mb-2">
                                <div class="flex justify-between items-center"><span><img src="${matchObj.logoHome}" class="team-logo-sm mr-1"> ${matchObj.teamHome}</span><span class="${matchObj.isLive ? 'text-amber-400' : 'text-gray-400'}">${matchObj.scoreHome}</span></div>
                                <div class="flex justify-between items-center"><span><img src="${matchObj.logoAway}" class="team-logo-sm mr-1"> ${matchObj.teamAway}</span><span class="${matchObj.isLive ? 'text-amber-400' : 'text-gray-400'}">${matchObj.scoreAway}</span></div>
                            </div>
                        </div>
                        <div class="pt-2 border-t border-slate-800/80 flex justify-between items-center text-[10px]">
                            <span class="text-amber-300 font-semibold"><i class="fa-solid fa-chart-line text-[9px] mr-1"></i>HDP: <strong class="text-white">${matchObj.hdp}</strong></span>
                            <span class="text-cyan-300 font-semibold"><i class="fa-solid fa-bullseye text-[9px] mr-1"></i>Pred: <strong class="text-emerald-400">${matchObj.prediction}</strong></span>
                        </div>
                    </div>
                `;
                sliderContainer.innerHTML += sliderCard;

                // Simpan Group per Liga
                if (!allMatchesGrouped[leagueName]) allMatchesGrouped[leagueName] = [];
                allMatchesGrouped[leagueName].push(matchObj);
            });

            // Mulai Auto Scroll
            startHorizontalAutoScroll();

            // Render Tampilan Utama
            renderMatchList();
        }

        // Function Render Match List (Mendukung Filter Pencarian)
        function renderMatchList(keyword = '') {
            const listContainer = document.getElementById('match-list');
            listContainer.innerHTML = '';

            let hasMatches = false;

            Object.keys(allMatchesGrouped).forEach(league => {
                const filteredMatches = allMatchesGrouped[league].filter(m => {
                    const searchStr = `${league} ${m.teamHome} ${m.teamAway}`.toLowerCase();
                    return searchStr.includes(keyword.toLowerCase().trim());
                });

                if (filteredMatches.length > 0) {
                    hasMatches = true;
                    let matchesHTML = '';

                    filteredMatches.forEach(m => {
                        matchesHTML += `
                            <div onclick="goToDaftar()" class="p-3 bg-slate-900/80 rounded-xl border ${m.isLive ? 'border-amber-500/60' : 'border-slate-800'} hover:border-cyan-500/50 cursor-pointer flex flex-wrap justify-between items-center gap-3 transition">
                                <!-- Waktu & Status -->
                                <div class="text-xs font-mono min-w-[90px]">
                                    ${m.isLive ? `<span class="px-2 py-0.5 rounded bg-emerald-500 text-slate-950 font-black text-[10px] animate-pulse">${m.minute}</span>` : `<span class="px-2 py-0.5 rounded bg-slate-800 text-gray-300 font-bold text-[10px]">UPCOMING</span>`}
                                    <div class="text-[10px] ${m.isLive ? 'text-emerald-400' : 'text-cyan-400'} mt-1 font-bold">${m.time}</div>
                                </div>

                                <!-- Tim & Skor -->
                                <div class="flex-grow space-y-1 min-w-[180px]">
                                    <div class="text-xs font-bold text-white flex justify-between">
                                        <span class="flex items-center gap-1.5"><img src="${m.logoHome}" class="team-logo-sm"> ${m.teamHome}</span>
                                        <span class="${m.isLive ? 'text-amber-400 font-black' : 'text-gray-400'}">${m.scoreHome}</span>
                                    </div>
                                    <div class="text-xs font-bold text-white flex justify-between">
                                        <span class="flex items-center gap-1.5"><img src="${m.logoAway}" class="team-logo-sm"> ${m.teamAway}</span>
                                        <span class="${m.isLive ? 'text-amber-400 font-black' : 'text-gray-400'}">${m.scoreAway}</span>
                                    </div>
                                </div>

                                <!-- Informasi HDP & Prediksi -->
                                <div class="flex items-center gap-2 border-t md:border-t-0 md:border-l border-slate-800 pt-2 md:pt-0 md:pl-4 min-w-[200px] justify-between md:justify-end">
                                    <div class="text-left md:text-right space-y-0.5">
                                        <div class="text-[11px] text-amber-300 font-medium">
                                            <span class="text-slate-400">HDP:</span> <strong class="text-white font-mono">${m.hdp}</strong>
                                        </div>
                                        <div class="text-[11px] text-cyan-300 font-medium">
                                            <span class="text-slate-400">PREDIKSI:</span> <strong class="text-emerald-400 font-mono">${m.prediction}</strong>
                                        </div>
                                    </div>
                                    <span class="league-badge bg-cyan-950 border border-cyan-500/40 text-cyan-300 ml-2 hidden sm:inline-block">PRESET</span>
                                </div>
                            </div>
                        `;
                    });

                    listContainer.innerHTML += `
                        <div class="space-y-2">
                            <div class="league-header px-3 py-2 rounded-lg flex items-center justify-between">
                                <span class="text-xs sm:text-sm font-extrabold text-cyan-300 tracking-wider uppercase">🏆 ${league}</span>
                            </div>
                            ${matchesHTML}
                        </div>
                    `;
                }
            });

            if (!hasMatches) {
                listContainer.innerHTML = `<div class="text-center py-8 text-cyan-300/60 text-xs">Pertandingan "${keyword}" tidak ditemukan.</div>`;
            }
        }

        // Trigger Pencarian Realtime
        function filterMatches() {
            const query = document.getElementById('search-input').value;
            renderMatchList(query);
        }

        // Run Fetch & Set Auto-Refresh
        document.addEventListener('DOMContentLoaded', () => {
            fetchRealtimeMatches();
            setInterval(fetchRealtimeMatches, CONFIG.AUTO_REFRESH_SECONDS * 1000);
        });
    </script>
</body>
</html>
